name: ci

on: [push]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up go
        uses: actions/setup-go@v4

      - name: Compile
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up go
        uses: actions/setup-go@v4

      # Generated tests (fern-go-sdk >=1.x) are WireMock client tests that
      # expect a mock server on localhost:8080 with the generated mappings.
      - name: Start WireMock
        run: |
          docker run -d --name wiremock -p 8080:8080 \
            -v "$GITHUB_WORKSPACE/wiremock/wiremock-mappings.json:/home/wiremock/mappings/wiremock-mappings.json" \
            wiremock/wiremock:3.9.1
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/__admin/health && break
            sleep 2
          done

      - name: Test
        run: go test ./...
